# Generated by yahr-theme — Catppuccin
$font = Maple Mono NF

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeInOut, 0.42, 0, 0.58, 1
    animation = fadeIn, 1, 4, easeInOut
    animation = fadeOut, 1, 4, easeInOut
    animation = inputFieldDots, 1, 2, easeInOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 350, 50
    outline_thickness = 2
    inner_color = rgba(1e1e2eE6)
    outer_color = rgba(89b4faFF)
    check_color = rgba(a6e3a1FF)
    fail_color = rgba(f38ba8FF)
    font_color = rgba(cdd6f4FF)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = Enter Password...
    fail_text = <span foreground="#f38ba8"><b>$FAIL ($ATTEMPTS)</b></span>
    dots_spacing = 0.3
    dots_center = true
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(cdd6f4FF)
    font_size = 120
    font_family = $font
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%m/%d/%Y"
    color = rgba(bac2deE6)
    font_size = 28
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(a6adc8CC)
    font_size = 18
    font_family = $font
    position = 0, -200
    halign = center
    valign = center
}
