# Generated by yahr-theme — NightFox
# 4-col grid: date 1x1 | time 1x3
#            system 1x1 | battery 1x1 | avatar 2x2
#            weather 1x2              | avatar 2x2
$font = JetBrainsMono Nerd Font
$ui = Inter
$icons = Symbols Nerd Font
$plate = rgba(181625F2)
$card = rgba(2b2837E6)
$muted = rgba(9b9cb8FF)

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeInOut, 0.42, 0, 0.58, 1
    animation = fadeIn, 1, 4, easeInOut
    animation = fadeOut, 1, 4, easeInOut
    animation = inputFieldDots, 1, 2, easeInOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.72
    contrast = 0.9
}

# Bar-colored plate behind the whole dashboard (tiles + password bar).
shape {
    monitor =
    size = 952, 788
    color = $plate
    rounding = 28
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Tiles sit on the plate with no drop shadows.
shape {
    monitor =
    size = 220, 220
    color = $card
    rounding = 22
    position = -354, 272
    halign = center
    valign = center
    zindex = 1
}

