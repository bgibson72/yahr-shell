# --- password ---
input-field {
    monitor =
    size = 888, 44
    outline_thickness = 0
    inner_color = rgba(18162500)
    outer_color = rgba(18162500)
    check_color = rgba(7eb4b3FF)
    fail_color = rgba(eb746bFF)
    font_color = rgba(cdcbe0FF)
    fade_on_empty = false
    rounding = 16
    font_family = $ui
    placeholder_text = type password to unlock
    fail_text = $FAIL ($ATTEMPTS)
    dots_spacing = 0.35
    dots_center = true
    dots_size = 0.25
    position = 0, -354
    halign = center
    valign = center
    zindex = 3
}
